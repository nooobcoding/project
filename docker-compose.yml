services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coin_autotrading
      POSTGRES_PASSWORD: coin_autotrading
      POSTGRES_DB: coin_autotrading
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coin_autotrading"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # 확장판 02-market-data.md 2장 — 시세 캐시(price:{symbol})·pending_symbols·토큰 버킷의
    # 백엔드. PRICE_CACHE_BACKEND=memory가 기본값이라 지금 당장은 안 켜도 backend가 뜨지만,
    # 4단계(market-data 분리)부터는 필수가 된다.
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://coin_autotrading:coin_autotrading@postgres:5432/coin_autotrading
      JWT_SECRET_KEY: dev-secret-change-me
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      # redis는 여기 없다 — PRICE_CACHE_BACKEND=memory가 기본값이라 backend는 지금 Redis를
      # 전혀 안 쓴다. redis:service_healthy를 넣으면 로컬 개발이 안 쓰는 의존성 때문에
      # 기동이 느려지거나 막힌다. PRICE_CACHE_BACKEND=redis로 직접 켤 때만 붙으면 된다.
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html

volumes:
  postgres_data:
